name: update-almas10

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # اجرای almas10.py هر 12 ساعت

permissions:
  contents: write

jobs:
  update-job:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests || echo "skip install"
      - run: timeout 600s python almas10.py || echo "❌ almas10.py failed or skipped"
      - run: |
          if [[ -s final10.txt || -s normal10.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final10.txt normal10.txt
            git commit -m "auto update from almas10.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final10.txt یا normal10.txt خالی یا موجود نیست، commit نشد"
          fi
