name: update-almas20

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */16 * * *"   # اجرای almas20.py هر 16 ساعت

permissions:
  contents: write

jobs:
  update-job:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests || echo "skip install"
      - run: timeout 600s python almas20.py || echo "❌ almas20.py failed or skipped"
      - run: |
          if [[ -s final20.txt || -s normal20.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final20.txt normal20.txt
            git commit -m "auto update from almas20.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final20.txt یا normal20.txt خالی یا موجود نیست، commit نشد"
