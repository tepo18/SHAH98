name: update-almas30

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"   # اجرای almas30.py هر 2 ساعت

permissions:
  contents: write

jobs:
  update-job:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests || echo "skip install"
      - run: timeout 600s python almas30.py || echo "❌ almas30.py failed or skipped"
      - run: |
          if [[ -s final30.txt || -s normal30.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final30.txt normal30.txt
            git commit -m "auto update from almas30.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final30.txt یا normal30.txt خالی یا موجود نیست، commit نشد"
          fi
