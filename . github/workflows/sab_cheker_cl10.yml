name: update-cl10

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"   # اجرای cl.py هر ۶ ساعت

permissions:
  contents: write

jobs:
  cl10-job:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: timeout 180s python cl10.py || echo "❌ cl10.py failed or skipped"
      - run: |
          if [[ -s final10.txt || -s normal10.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final10.txt normal10.txt
            git commit -m "auto update from cl10.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final10.txt یا normal10.txt خالی یا موجود نیست، commit نشد"
          fi
