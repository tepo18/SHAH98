name: Sub Checker All-in-One Synced

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # اجرای cl10.py هر ۱۲ ساعت
    - cron: "0 */24 * * *"   # اجرای cl20.py هر ۲۴ ساعت
    - cron: "0 0 * * *"   # غیرفعال کردن اجرای cl3.py
    - cron: "0 0 * * *"   # غیرفعال کردن اجرای cl4.py

permissions:
  contents: write

jobs:

  cl10-job:
    name: Run cl10.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final10.txt normal10.txt
          timeout 180s python cl10.py || echo "❌ cl10.py failed or skipped"
      - run: |
          if [[ -s final10.txt || -s normal10.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final10.txt normal10.txt
            git commit -m "auto update from cl10.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final10.txt یا normal10.txt خالی یا موجود نیست، commit نشد"
          fi

  cl20-job:
    name: Run cl20.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final20.txt normal20.txt
          timeout 300s python cl20.py || echo "❌ cl20.py failed or skipped"
      - run: |
          if [[ -s final20.txt || -s normal20.txt ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final20.txt normal20.txt
            git commit -m "auto update from cl20.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final20.txt یا normal20.txt خالی یا موجود نیست، commit نشد"
          fi

  cl3-job:
    name: Run CL3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final.json normal.json
          timeout 600s python cl3.py || echo "❌ cl3.py failed or skipped"
      - run: |
          if [[ -s final.json || -s normal.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final.json normal.json
            git commit -m "auto update from cl3.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final.json یا normal.json خالی یا موجود نیست، commit نشد"
          fi

  cl4-job:
    name: Run CL4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests psutil retrying PyYaml || echo "skip install"
      - run: |
          rm -f final2.json normal2.json
          timeout 600s python cl4.py || echo "❌ cl4.py failed or skipped"
      - run: |
          if [[ -s final2.json || -s normal2.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final2.json normal2.json
            git commit -m "auto update from cl4.py [skip ci]" || echo "No changes"
            git push || echo "skip push"
          else
            echo "⚠️ final2.json یا normal2.json خالی یا موجود نیست، commit نشد"
          fi
